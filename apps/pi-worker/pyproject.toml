[project]
name = "apex-worker"
version = "0.1.0"
description = "APEX Raspberry Pi worker: market scanner, signal research, Discord gateway and signed agent client"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - private project" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "exchange-calendars>=4.6",
    "httpx>=0.28",
    "pydantic>=2.9",
    "cryptography>=43",
    "python-dotenv>=1.0",
    "jsonschema>=4.23",
    "tzdata>=2024.1",
    "websockets>=13",
]

[project.optional-dependencies]
discord = ["discord.py>=2.5,<3"]
research = ["scikit-learn>=1.5", "pyarrow>=17"]

[project.scripts]
apex = "apex_worker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "datamodel-code-generator>=0.26",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_worker"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/apex_worker/contracts/models.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: longer research/replay tests",
    "postgres: requires a local PostgreSQL server binary",
]
asyncio_mode = "auto"
