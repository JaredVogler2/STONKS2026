# Prospective forward shadow of the frozen realeq-protocol-2 (A1) arms: Discovery V3 PR-A
# (amendments/discovery-v3-2026-10-22/02_FORWARD_SHADOW_FIRST.md; runbook docs/discovery-v3/FORWARD_SHADOW.md).
#
#   two weekday attempts after the NYSE close -> verify every stored record and the hash chain -> post any record whose
#   earlier post GitHub did not confirm (same digest) -> MISSED_OBSERVATION for every session whose window closed without
#   a decision -> DECISION for the session whose window is open (fresh Alpaca historical SIP bars through t, the frozen
#   S1 E0X1 / S2 E0X1 / S3 C_X0 / S5 R10 logic, matched-control draw order) -> OUTCOME for decisions whose 22-session label
#   window and 2-session finality lag have passed -> job summary (counts only) -> short-retention report artifact.
#
# * Research only: no orders, no alerts, no Discord, no model signing or promotion, no group-actionable output.
# * Storage and anchor = comments on a dedicated issue that this workflow creates ("APEX forward-shadow ledger ·
#   qv2a1-frozen-v1 · vol 1"). GitHub's comment timestamp is the independent anchor. The job token is contents: read +
#   issues: write ONLY: it never commits, pushes or opens PRs.
# * Secrets: only ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY of the `real-equities-research` environment (deployment
#   branch main), exposed to the recorder step only and never echoed. Missing keys fail the run (CREDENTIALS_MISSING is
#   recorded); there is no synthetic fallback.
# * No raw OHLCV leaves the runner: bars live in a temporary directory. The only cache is the outbox of records whose
#   post was not confirmed (record JSON: plans, hashes, counts; no market data). The store refuses raw bar fields/secrets.
# * Alarm: the job FAILS (GitHub notifies the owner) when a session was missed, the source is invalid, credentials are
#   missing, an anchor is pending or the ledger does not verify. SOURCE_PENDING on the first attempt is a warning only.
# * Max runtime: timeout-minutes 12 x (2 weekday attempts + 1 Saturday retry) (= 588 min in a 22-weekday, 5-Saturday
#   month, reserved in the budget forecast before optional drift); expected ~4-6 min for a decision run, ~1-2 min for a
#   no-op retry.
# Never runs for pull_request; default branch only. Actions pinned to full commit SHAs (version in the trailing comment).
name: apex-forward-shadow

on:
  schedule:
    # 18:12 and 21:52 America/New_York on weekdays (IANA `timezone` key, as apex-model-drift.yml): at least 90 minutes
    # after a 16:00 close and well before the next 09:30 open, in EST and EDT alike. Holidays: the recorder finds no
    # session and does nothing. Off the top of the hour to reduce GitHub's scheduler delay and drop risk.
    - cron: "12 18 * * 1-5"
      timezone: "America/New_York"
    - cron: "52 21 * * 1-5"
      timezone: "America/New_York"
    # Saturday 12:12: one more attempt for a Friday session, whose window stays open until Monday's open
    - cron: "12 12 * * 6"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual run (it records exactly what a scheduled run would at this moment; it never back-fills)"
        required: true
        type: string

permissions:
  contents: read

# One recorder at a time (records are chained); never cancels a run in progress.
concurrency:
  group: apex-forward-shadow
  cancel-in-progress: false

jobs:
  record:
    name: record
    # default branch only: schedules always run there; a dispatch from another ref is refused (and the environment's
    # deployment-branch rule withholds the secrets anyway)
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: real-equities-research
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
        working-directory: apps/pi-worker
    env:
      APEX_RESEARCH_ONLY: "true"
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Record start
        working-directory: .
        run: |
          echo "APEX_OUT=$RUNNER_TEMP/apex-forward" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/apex-forward"
          echo "[]" > "$RUNNER_TEMP/apex-forward/outbox.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: apps/pi-worker/uv.lock
      - name: Install (locked, runtime only)
        run: uv sync --locked --no-dev
      - name: Restore the outbox (unconfirmed records only; no market data)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apex-forward/outbox.json
          key: apex-forward-outbox-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apex-forward-outbox-
      - name: Forward shadow (research only)
        id: record
        timeout-minutes: 10
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          uv run --no-sync apex research forward-shadow run --store github --source alpaca \
            --outbox "$APEX_OUT/outbox.json" --report-json "$APEX_OUT/report.json" --summary-md "$APEX_OUT/summary.md"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) ;;
            3) echo "::warning title=SOURCE_PENDING::the decision bar is not final yet; the next attempt retries before the deadline" ;;
            4) echo "::error title=MISSED_OBSERVATION::a session closed without a recorded decision (see the job summary)"; exit 4 ;;
            5) echo "::error title=SOURCE_INVALID::market data unavailable, not entitled or credentials missing (see the job summary)"; exit 5 ;;
            6) echo "::error title=INTEGRITY::the ledger, frozen inputs or series configuration do not verify; nothing was recorded"; exit 6 ;;
            7) echo "::error title=ANCHOR_PENDING::GitHub did not confirm a record; it is kept in the outbox and re-posted next run"; exit 7 ;;
            *) exit "$rc" ;;
          esac
      - name: Job summary
        if: always()
        run: |
          if [ -f "$APEX_OUT/summary.md" ]; then cat "$APEX_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save the outbox
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apex-forward/outbox.json
          key: apex-forward-outbox-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the run report (digests, anchors and counts; no market data)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apex-forward-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apex-forward/report.json
            ${{ runner.temp }}/apex-forward/summary.md
            ${{ runner.temp }}/apex-forward/outbox.json
          retention-days: 30
          if-no-files-found: ignore
