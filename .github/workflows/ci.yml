# CI for pull requests and pushes to main. Runs untrusted PR code, so it has NO secrets, NO environment and a
# read-only token. Release credentials live only in the `model-release` environment used by the apex-model-* workflows,
# which never run for pull_request events.
#
# Speed and minutes. Standard GitHub-hosted runners are free for a public repository; a private one has 2,000 free
# minutes a month, shared with the scheduled research lanes. Either way:
# * `changes` skips the jobs a change cannot affect. The Python tests read docs, fixtures and workflow files as well as
#   the worker, so only a change confined to the web app skips them; the web job runs only when the web app, the
#   contracts or their generators change. Without a usable base commit every job runs.
# * `tested` (push to main only): when the merged file tree already passed this workflow in its pull request, the
#   heavy jobs are skipped instead of repeated. That job alone can list this workflow's runs (actions: read); it never
#   runs for pull_request events, so pull-request code never holds that token.
# * pytest runs on every core of the runner (pytest-xdist, one file per worker).
#
# Third-party actions are pinned to full commit SHAs (version in the trailing comment), resolved with
# `git ls-remote https://github.com/<owner>/<action> refs/tags/<tag>` (annotated tags dereferenced with ^{}).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.areas.outputs.python }}
      smoke: ${{ steps.areas.outputs.smoke }}
      node: ${{ steps.areas.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the changed files
        id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          everything() {
            printf 'python=true\nsmoke=true\nnode=true\n' >> "$GITHUB_OUTPUT"
            echo "No usable base commit: every job runs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          case "$BASE" in "" | 0000000000000000000000000000000000000000) everything ;; esac
          git cat-file -e "$BASE^{commit}" 2> /dev/null || everything
          files=$(git diff --name-only "$BASE" HEAD) || everything
          [ -n "$files" ] || everything
          python=false smoke=false node=false
          while IFS= read -r f; do
            case "$f" in
              apps/web/* | package.json | pnpm-lock.yaml | pnpm-workspace.yaml | .nvmrc | .npmrc) ;;
              *) python=true ;;
            esac
            case "$f" in
              apps/pi-worker/* | fixtures/* | packages/* | .github/workflows/ci.yml) smoke=true ;;
            esac
            case "$f" in
              apps/web/* | packages/* | supabase/* | apps/pi-worker/src/apex_worker/contracts/* \
                | apps/pi-worker/pyproject.toml | apps/pi-worker/uv.lock | package.json | pnpm-lock.yaml \
                | pnpm-workspace.yaml | .nvmrc | .npmrc | .github/workflows/ci.yml) node=true ;;
            esac
          done <<< "$files"
          printf 'python=%s\nsmoke=%s\nnode=%s\n' "$python" "$smoke" "$node" >> "$GITHUB_OUTPUT"
          echo "$(wc -l <<< "$files") changed files: python=$python smoke=$smoke node=$node" >> "$GITHUB_STEP_SUMMARY"

  tested:
    name: already passed in its pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      duplicate: ${{ steps.tree.outputs.duplicate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Same file tree as a passing pull-request run?
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          if gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&status=success&per_page=50" \
              --jq '.workflow_runs[].head_commit.tree_id' | grep -qxF "$tree"; then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
            echo "Tree $tree already passed CI in its pull request: the heavy jobs are skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi

  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Scanner unit tests
        run: node --test scripts/secret-scan.test.mjs
      - name: Scan tracked files
        run: node scripts/secret-scan.mjs

  node:
    name: web + contracts (lint, typecheck, test, build)
    needs: [changes, tested]
    if: ${{ !cancelled() && needs.changes.outputs.node != 'false' && needs.tested.outputs.duplicate != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # the contracts drift check regenerates the Pydantic models too (datamodel-codegen + ruff from the pi-worker dev group)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: apps/pi-worker/uv.lock
      - name: Install Python codegen tools (locked)
        run: uv sync --locked --project apps/pi-worker
      - name: Contracts codegen drift check
        run: pnpm contracts:check
      - name: Embedded migrations drift check
        run: pnpm --filter @apex/web gen:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + integration tests
        run: pnpm test
      - name: Build (DEMO mode, no secrets)
        env:
          APEX_MODE: DEMO
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

  python:
    name: pi-worker (ruff, pytest)
    needs: [changes, tested]
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' && needs.tested.outputs.duplicate != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/pi-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: apps/pi-worker/uv.lock
      - name: Install (locked, all extras so the Discord + research tests run)
        run: uv sync --locked --all-extras
      - name: Ruff
        run: uv run --no-sync ruff check src tests
      - name: Pytest (one worker per core; a file's tests share a worker)
        run: uv run --no-sync pytest -q -p no:cacheprovider -n auto --dist loadfile

  forward-shadow-smoke:
    # DEMO only: the forward-shadow recorder end to end on the synthetic fixture over a simulated calendar (decisions,
    # a pending source, a missed session, catch-up, maturity, chain verification). No secrets, no market data, no writes.
    name: forward-shadow smoke (synthetic fixture, DEMO)
    needs: [changes, tested]
    if: ${{ !cancelled() && needs.changes.outputs.smoke != 'false' && needs.tested.outputs.duplicate != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/pi-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: apps/pi-worker/uv.lock
      - name: Install (locked, runtime only)
        run: uv sync --locked --no-dev
      - name: Smoke (SYNTHETIC_FIXTURE_DEMO)
        run: uv run --no-sync apex research forward-shadow smoke --out "$RUNNER_TEMP/forward-smoke"
      - name: Evidence tournament lane smoke (DEMO; docs/evidence/TOURNAMENT_LANE.md)
        run: uv run --no-sync apex research forward-shadow tournament-smoke --out "$RUNNER_TEMP/tournament-smoke"
      - name: Evidence tournament cohort 1 smoke (DEMO; docs/evidence/TOURNAMENT_COHORT_1.md)
        run: |
          uv run --no-sync apex research forward-shadow tournament-smoke --lane tournament-c1 \
            --out "$RUNNER_TEMP/tournament-c1-smoke"
      - name: Live picks smoke (DEMO; picks/README.md)
        run: uv run --no-sync apex research forward-shadow picks-smoke --out "$RUNNER_TEMP/picks-smoke"
      - name: Job summary
        if: always()
        run: |
          for f in "$RUNNER_TEMP/forward-smoke/summary.md" "$RUNNER_TEMP/tournament-smoke/summary.md" \
              "$RUNNER_TEMP/tournament-c1-smoke/summary.md" "$RUNNER_TEMP/picks-smoke/summary.md"; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload the DEMO ledgers (synthetic; 7-day retention)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forward-shadow-smoke-demo-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/forward-smoke/
            ${{ runner.temp }}/tournament-smoke/
            ${{ runner.temp }}/tournament-c1-smoke/
            ${{ runner.temp }}/picks-smoke/
          retention-days: 7
          if-no-files-found: ignore

  workflow-lint:
    name: workflow lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
      - name: actionlint (pinned PyPI build; uses the runner's shellcheck)
        run: uv tool run --from actionlint-py==1.7.12.25 actionlint -color

  # e2e (Playwright: 1440 px + 390 px journeys and axe WCAG checks) is run locally with `pnpm e2e` and is deliberately
  # not a CI job: it roughly doubles the minutes per push, and the free Actions minutes are budgeted for the model
  # workflows first (docs/AUTONOMOUS_TRAINING.md). To add it, use a separate job with no secrets and APEX_MODE=DEMO:
  #   pnpm install --frozen-lockfile && pnpm --filter @apex/web exec playwright install --with-deps chromium && pnpm e2e
