# Manual, research-only real-equity evaluation (build-prompts/14_REAL_EQUITIES_VALIDATION_EXECUTION.md, Phase 14;
# Quant V2 protocol-2: research-results/real-equities/PROTOCOL_V2.md).
#
#   secrets preflight -> static minutes checkpoint (before any fetch) -> fresh bounded Alpaca historical SIP daily
#   download into the runner's temp dir -> data-quality / bias inventory -> FROZEN manifest -> evaluation under the
#   chosen frozen protocol -> seven compact report files -> 7-day artifact.
#   realeq-protocol-1 (default): fixed78, H1-H8 + baselines. realeq-protocol-2 (opt-in): U1 S&P 500 snapshot, S1-S5 +
#   legacy comparators, matched controls, DEV-only arm selection and one untouched PRESAMPLE evaluation.
#
# * Research only: no model signing, no release/registry API, no promotion, no Discord, no orders, no id-token.
# * Only the read-only market-data secrets ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY (environment
#   `real-equities-research`, deployment branch main), exposed to the preflight and research steps only, never echoed.
# * No synthetic fallback: missing keys => BLOCKED — ALPACA_ACTIONS_SECRETS_MISSING; invalid keys, missing SIP
#   entitlement, rate limiting or insufficient history fail the job with the protocol status and reason.
# * No raw OHLCV leaves the runner: bars live in a temporary directory removed when the research step ends; no Actions
#   cache. The artifact holds only the seven aggregate files listed below.
# * Publishing is a reviewed PR that copies the artifact into research-results/real-equities/<experiment_id>/: this
#   workflow has a read-only token and never commits, pushes or opens PRs.
# * Max runtime: timeout-minutes 45 per manual run on a standard ubuntu runner (protocol-2 research budget; protocol-1
#   finishes in about 2 minutes). docs/COST_AND_QUOTAS.md.
# Actions pinned to full commit SHAs (version in the trailing comment).
name: apex-real-equities-research

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Data source (real historical SIP only; there is no synthetic option here)"
        required: true
        default: alpaca
        type: choice
        options: [alpaca]
      years:
        description: "Years of daily history (3-10)"
        required: true
        default: "8"
        type: string
      experiment_id:
        description: "Experiment label: lower-case letters, digits and single hyphens, e.g. 2026-10-fixed78-sip-8y"
        required: true
        type: string
      universe:
        description: "Universe: fixed78 (realeq-protocol-1) or u1-sp500 (realeq-protocol-2)"
        required: true
        default: fixed78
        type: choice
        options: [fixed78, u1-sp500]
      protocol:
        description: "Frozen protocol (protocol-2 is opt-in; it fixes its own window, so years/time_start are ignored or rejected)"
        required: true
        default: realeq-protocol-1
        type: choice
        options: [realeq-protocol-1, realeq-protocol-2]
      time_start:
        description: "Optional first decision date YYYY-MM-DD (blank = protocol default after warm-up)"
        required: false
        default: ""
        type: string
      time_end:
        description: "Optional last data session YYYY-MM-DD (blank = latest completed NYSE session)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One research download at a time; never cancels a running experiment. Independent of the model-registry group.
concurrency:
  group: apex-real-equities-research
  cancel-in-progress: false

jobs:
  research:
    name: research
    # trusted default branch only (the environment's deployment-branch rule refuses the secrets elsewhere anyway)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: real-equities-research
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: apps/pi-worker
    env:
      APEX_RESEARCH_ONLY: "true"
      APEX_ACTIONS_MONTHLY_BUDGET: ${{ vars.APEX_ACTIONS_MONTHLY_BUDGET }}
      PYTHONHASHSEED: "0"
      TZ: UTC
    steps:
      - name: Record start
        working-directory: .
        run: |
          echo "APEX_OUT=$RUNNER_TEMP/apex-realeq" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/apex-realeq/report"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preflight (read-only Alpaca market-data secrets present?)
        id: preflight
        working-directory: .
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          if [ -n "$ALPACA_KEY_ID" ] && [ -n "$ALPACA_SECRET_KEY" ]; then
            echo "keys=true" >> "$GITHUB_OUTPUT"
            echo "Alpaca market-data secrets present (values are never printed)."
          else
            echo "keys=false" >> "$GITHUB_OUTPUT"
            msg="ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY are not secrets of the real-equities-research environment. No synthetic fallback runs; the research step records the blocker."
            echo "::error title=BLOCKED — ALPACA_ACTIONS_SECRETS_MISSING::$msg"
            { echo "## BLOCKED — ALPACA_ACTIONS_SECRETS_MISSING"; echo; echo "$msg"; echo; echo "Setup: research-results/real-equities/PROTOCOL.md (owner one-time actions)."; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: apps/pi-worker/uv.lock
      - name: Install (locked, runtime only)
        run: uv sync --locked --no-dev
      - name: Minutes checkpoint (before any data fetch)
        id: budget
        run: |
          set +e
          uv run --no-sync apex research budget-check --timeout-minutes 45 --out "$APEX_OUT/budget.json"
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then echo "::warning title=SKIPPED_BUDGET::worst-case Actions minutes exceed the configured budget; nothing was fetched"; fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
      - name: Real-equity research (Alpaca historical SIP, research only)
        id: research
        if: steps.budget.outputs.proceed == 'true'
        timeout-minutes: 40
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SOURCE: ${{ inputs.source }}
          YEARS: ${{ inputs.years }}
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          UNIVERSE: ${{ inputs.universe }}
          PROTOCOL: ${{ inputs.protocol }}
          TIME_START: ${{ inputs.time_start }}
          TIME_END: ${{ inputs.time_end }}
        run: |
          if [ "$SOURCE" != "alpaca" ]; then echo "::error::source must be alpaca"; exit 5; fi
          if ! [[ "$YEARS" =~ ^[0-9]{1,2}$ ]]; then echo "::error::years must be an integer"; exit 5; fi
          args=(--source alpaca --years "$YEARS" --experiment-id "$EXPERIMENT_ID" --universe "$UNIVERSE"
                --protocol "$PROTOCOL" --out "$APEX_OUT/report" --github-output)
          if [ -n "$TIME_START" ]; then args+=(--time-start "$TIME_START"); fi
          if [ -n "$TIME_END" ]; then args+=(--time-end "$TIME_END"); fi
          uv run --no-sync apex research real-equities "${args[@]}"
      - name: Job summary
        if: always()
        run: |
          if [ -f "$APEX_OUT/report/comparisons.md" ]; then head -n 40 "$APEX_OUT/report/comparisons.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$APEX_OUT/report/execution_log.md" ]; then { echo; cat "$APEX_OUT/report/execution_log.md"; } >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$APEX_OUT/budget.json" ]; then { echo; echo '```json'; cat "$APEX_OUT/budget.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload research summary (seven aggregate files only, short retention)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apex-realeq-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apex-realeq/report/manifest.json
            ${{ runner.temp }}/apex-realeq/report/data_quality.json
            ${{ runner.temp }}/apex-realeq/report/strategy_metrics.json
            ${{ runner.temp }}/apex-realeq/report/trades_summary.csv
            ${{ runner.temp }}/apex-realeq/report/comparisons.md
            ${{ runner.temp }}/apex-realeq/report/recommendations.md
            ${{ runner.temp }}/apex-realeq/report/execution_log.md
          retention-days: 7
          if-no-files-found: ignore
